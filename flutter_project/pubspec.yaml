name: maa_lakshmi_mobile
description: "Maa Lakshmi Mobile And Electronics - Storefront & Admin ERP (Surat)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Backend Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+3

  # State Management & Routing
  provider: ^6.1.2
  go_router: ^14.3.2

  # Typography, Formatting & Network
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.12
  url_launcher: ^6.3.0
  flutter_staggered_animations: ^1.1.1
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
